default_install_hook_types: [pre-commit, post-commit]
default_stages: [pre-commit]
default_language_version:
    python: python3.12

repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black


  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: sync-db
        name: Sync Questions DB
        entry: python scripts/update_db.py
        language: python
        additional_dependencies: [py-codeforce==1.3, rich==14.1.0]
        verbose: true
        pass_filenames: true

      - id: attempts
        name: Record attempt info (time / result / failure reason)
        entry: python scripts/attempts.py ask --sync --last-commit
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: true
